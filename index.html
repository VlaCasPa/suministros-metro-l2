<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Suministros - Línea 2 y 4</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Título Principal -->
    <div id="titulo-flotante">Control de Suministros (Agua y Electricidad) - Línea 2</div>

    <!-- Panel de Búsqueda y Filtros -->
    <div id="panel-filtros">
        <div class="filtro-grupo">
            <label for="input-buscar">🔍 Buscar Suministro / ID:</label>
            <input type="text" id="input-buscar" placeholder="Ej: 7355727, E01, Luz..." onkeyup="filtrarMapa()">
        </div>
        <div class="filtro-grupo">
            <label for="select-tipo">Tipo:</label>
            <select id="select-tipo" onchange="filtrarMapa()">
                <option value="TODOS">Todos</option>
                <option value="AGUA">Agua</option>
                <option value="LUZ">Electricidad (Luz)</option>
            </select>
        </div>
        <div class="filtro-grupo">
            <label for="select-empresa">Empresa:</label>
            <select id="select-empresa" onchange="filtrarMapa()">
                <option value="TODAS">Todas</option>
                <option value="SEDAPAL">SEDAPAL</option>
                <option value="PLUZ">PLUZ ENERGÍA</option>
            </select>
        </div>
        <div class="filtro-grupo">
            <label for="select-estado">Estado:</label>
            <select id="select-estado" onchange="filtrarMapa()">
                <option value="TODOS">Todos</option>
                <option value="ACTIVO">Activo</option>
                <option value="BAJA">Baja</option>
            </select>
        </div>
    </div>

    <!-- Contenedor del Mapa -->
    <div id="map"></div>

    <!-- Librerías JS y Archivos Locales -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="datos.js"></script>
    <script src="app.js"></script>
</body>
</html>
